spring:
  application.name: corporate-payment-hub
  datasource:
    url: jdbc:h2:mem:cph;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: create-drop
    open-in-view: false
  h2.console.enabled: true
management.endpoints.web.exposure.include: health,info,metrics
server.port: 8080
